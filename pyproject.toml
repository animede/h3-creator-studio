[project]
name = "yuzu-creator-studio"
version = "1.0.0"
description = "MiniMax-H3 / H3-Image / ACE-Step / AivisSpeech を 1 つの画面から使う制作スタジオ(管理役)"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "YUZUKI (ゆずき)"}]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "psutil",
    "pillow",
    "python-multipart",
    "huggingface_hub",
    "py7zr",
    "multivolumefile",
]

[project.optional-dependencies]
agent = ["mcp>=2.3,<3"]          # agent/ の MCP サーバを使う人だけ(agent/requirements.txt と同じ)

[tool.setuptools]
packages = ["studio", "studio.handlers", "studio.mvtools"]
