# YUZU Creator Studio の既定設定(リポジトリに含める)。
# 個人の設定は studio.local.toml(git 管理外)に同じ形式で書くと、こちらを上書きする。

host = "127.0.0.1"
port = 8700
components_dir = "components"   # エンジンを置くフォルダ(リポジトリ直下からの相対)

# 各エンジン: repo = components_dir 内のフォルダ名、dir = 場所を直接指定(絶対パス可)、
#         port = 待ち受けポート、enabled = false で無効化、env = 追加の環境変数、
#         vram_budget_gb = share のときの VRAM の利用枠(GiB。書かなければ下の [gpu] の説明の既定)
[components.h3]
repo = "minimax-h3"
port = 8611
enabled = true

[components.h3image]
repo = "minimax-h3-image-server"
port = 8633
enabled = true

[components.ace]
repo = "ACE-Step-1.5-fast"
port = 8001
enabled = true

[components.aivis]
repo = "AivisSpeech-Engine"
port = 10101
enabled = true

# GPU の使い方。
#   mode = "auto"      総 VRAM が 40GiB 以上なら share、それ未満なら exclusive(既定)
#   mode = "exclusive" GPU に載せるエンジンは常に 1 つ。生成のたびに自動で載せ替える(12GB 級はこれ)
#   mode = "share"     大きな GPU 向け。複数のエンジンを同時に載せ、別々のエンジンの生成を並行に走らせる。
#                      エンジンごとに VRAM の利用枠を割り当てて起動時にエンジンへ渡し、利用枠の合計が収まるかぎり他を降ろさずに載せる。
#                      足りなければ、仕事中でないエンジンを最後に使った時刻の古い順に降ろし、それでも足りなければ
#                      仕事中のエンジンが空くまで待つ(ジョブには「GPU の空きを待っています」と出る)。
# share の利用枠の既定は、総 VRAM T に対して h3 = min(T×0.5, 48)GiB、h3image = min(T×0.35, 31)GiB、ace = 14GiB。
# エンジンごとに [components.h3] vram_budget_gb = 40 のように書くと上書きできる(exclusive では利用枠を渡さない)。
# GPU を使わない仕事(TTS、MV の音声分離など)は、GPU の使い方によらず CPU で 2 本まで同時に走る。
[gpu]
mode = "auto"
# devices = GPU が 2 枚以上ある PC で、エンジンをどの GPU で動かすか。
#   "auto" = 管理役が VRAM を数える 1 枚(CUDA_VISIBLE_DEVICES の先頭、無ければ 0 番)に、すべてのエンジンを寄せる
#            (子に CUDA_VISIBLE_DEVICES=<その番号> を渡す。GPU が 1 枚なら何もしない)
#   "all"  = 寄せない(エンジンが自分で複数の GPU を使う。VRAM の計算は 1 枚分のまま)
#   "1" など = その番号の GPU を管理し、エンジンもそこへ寄せる
# 管理役を起動する環境や [components.<name>.env] に CUDA_VISIBLE_DEVICES を書いたときは、そちらが優先(上書きしない)。
devices = "auto"
# free_cpu_engines = GPU の仕事(画像・動画・音楽・MV・ショート動画のシーン)を始める前に、待機中の CPU の手伝い
#   (管理役が起動した AivisSpeech と同梱 LLM。使っている最中のものは止めない)を止めて RAM を空けるか。止めたものは次に使うときに起動し直す。
#   "auto" = 搭載 RAM が 32GiB 未満のときだけ / "always" = いつも / "never" = 止めない
free_cpu_engines = "auto"
# stop_on_switch = GPU のエンジンを切り替えるとき、降ろしたエンジンのプロセスも止めて RAM を返すか(次に使うときは起動し直すので、少し遅くなる)。
#   降ろしただけのプロセスは RAM を持ったままで、RAM 16GB の PC では、次のエンジンが読み込みの途中で落ちることがある(画像の後に MV など)。
#   "auto" = 搭載 RAM が 32GiB 未満のときだけ / "always" = いつも / "never" = 止めない(降ろすだけ)
stop_on_switch = "auto"

# MV・ショート動画タブの音声処理(Demucs のボーカル分離、シーン分割、読み上げの分割)を動かす Python。
# 空なら setup が既定で作る components/mvtools/.venv を使う(--no-mv で飛ばせる。--only mvtools でこれだけ入れる)。すでに Demucs と librosa の入った環境があれば、その python を書く。
# device = ボーカルの分離(Demucs)を動かす装置。空なら CPU("cuda" で GPU。GPU の仕事と VRAM を取り合うので、空きに余裕があるときだけ)。
# subtitle_font = ショート動画のセリフのテロップ(字幕)の字体の名前。空なら Noto Sans CJK JP(無ければ libass が同じ文字を持つ字体に置き換える。Windows は Meiryo など)。
[mv]
tools_python = ""
device = ""
subtitle_font = ""

# 管理役が持つ LLM(プロンプト強化・作詞)。llama.cpp の llama-server で Gemma 4 E4B を動かす。
# gpu = "auto"(空き VRAM に入る分だけ GPU、残りは CPU)/ "off"(CPU のみ)/ "all" / 層数
# gguf・llama_server を書くと、取得せずにそのファイルを使う。tools_dir は取得先(リポジトリ直下からの相対)。
# mmproj = 画像・音声を読む投影ファイル(MV の「画像から作る」「曲から作る」。mmproj-gemma-4-E4B-it-Q8_0.gguf、約 0.56GB)。空なら、GGUF の隣か tools_dir を探し、
# 無ければ画像・音声を頼まれたときに 1 回だけ取得する(無くてもテキストの LLM は動く)。
# GPU で生成している間は、LLM を待たせず、CUDA を隠した CPU 専用で動かす(遅くなる)。仕事が無くなると GPU 版へ戻る。
[llm]
port = 8701
gpu = "auto"
gguf = ""
mmproj = ""
llama_server = ""
tools_dir = "components/llm"
